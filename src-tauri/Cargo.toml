[package]
name = "gptray"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0"
description = "A free tray GUI for GlobalProtect-openconnect. VIBE CODED: AI-written with minimal human review; use at your own risk."

# Standalone on purpose: keeps this app out of the main workspace and its lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
gpapi = { path = "../../../crates/gpapi" }
common = { path = "../../../crates/common" }
tokio-tungstenite = "0.30"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[features]
default = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
