[package]
name = "gptray"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0"
description = "A free tray GUI for GlobalProtect-openconnect. VIBE CODED: AI-written with minimal human review; use at your own risk."

# Standalone: builds on its own, outside the GlobalProtect-openconnect workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# The gpservice protocol client. Pin both to the upstream release that is installed:
# gpservice only accepts clients built for its exact version. To target a new release,
# change both tags (build.rs and the OBS spec read the version from here).
gpapi = { git = "https://github.com/yuezk/GlobalProtect-openconnect", tag = "v3.2.0" }
common = { git = "https://github.com/yuezk/GlobalProtect-openconnect", tag = "v3.2.0" }
tokio-tungstenite = "0.30"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
# Already in the tree via tao; used to detect whether a tray host is running.
dbus = "0.9"

[features]
default = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
